name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # No requirements file; this is the install line from CLAUDE.md.
      - run: python -m pip install pandas numpy scikit-learn joblib pytest
      # Skips nothing: the `slow` real-data guards read only tracked files
      # (data/research/xfp_cache, data/outputs, data/models) and no test uses
      # the network.
      - run: python -m pytest tests -q
